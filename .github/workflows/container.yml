# Container image (issue #167, PRD 13A, ADR-025): build, smoke test and vulnerability scan.
# Runs on GitHub's hosted runner, which has Docker; the dev machine does not need it.
# No secrets, no push to a registry: Render builds its own copy from the Dockerfile.
name: container

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "demo/**", "pyproject.toml", "uv.lock", "src/**", "config/**", "ui/**", ".github/workflows/container.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: docker build -t refdesk-api:ci .
      - name: size
        run: |
          docker image inspect refdesk-api:ci --format '{{.Size}}' | awk '{printf "image size: %.0f MB\n", $1/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: smoke test (serves /healthz as a non-root user)
        run: |
          docker run -d --name api -p 8000:8000 --memory 512m refdesk-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz
          test "$(docker exec api id -u)" = "10001"
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root"'
          docker stats --no-stream --format 'memory after start: {{.MemUsage}}' api | tee -a "$GITHUB_STEP_SUMMARY"
      - name: logs on failure
        if: failure()
        run: docker logs api || true
      - name: scan (HIGH and CRITICAL, report only; triage in docs/ops/container-scan.md)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL \
            --format table --exit-code 0 refdesk-api:ci | tee trivy.txt
          { echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The public demo image (ADR-025): the same Dockerfile with REFDESK_IMAGE=demo, as Render
  # builds it. The store is rebuilt from demo/; no images (the UI loads them from the Met).
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: docker build --build-arg REFDESK_IMAGE=demo -t refdesk-demo:ci .
      - name: smoke test (recorded runs served, writes refused)
        run: |
          docker run -d --name demo -p 8000:8000 --memory 512m refdesk-demo:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          runs=$(curl -fsS http://127.0.0.1:8000/runs | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          expected=$(python3 -c 'import json; print(len(json.load(open("demo/manifest.json"))["runs"]))')
          test "$runs" = "$expected"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"brief":"x"}' http://127.0.0.1:8000/boards)" = "403"
          run=$(python3 -c 'import json; print(json.load(open("demo/manifest.json"))["runs"][0])')
          curl -fsS "http://127.0.0.1:8000/runs/$run" | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["items"] and v["events"], "empty run"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"approver":"x","acknowledged":true}' "http://127.0.0.1:8000/runs/$run/approve")" = "403"
          test "$(docker exec demo id -u)" = "10001"
          docker stats --no-stream --format 'demo memory after start: {{.MemUsage}}' demo | tee -a "$GITHUB_STEP_SUMMARY"
          docker image inspect refdesk-demo:ci --format '{{.Size}}' | awk '{printf "demo image size: %.0f MB\n", $1/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: logs on failure
        if: failure()
        run: docker logs demo || true
