# PR tier (ADR-019): fast and deterministic. No model calls, no secrets.
# Actions are pinned by commit SHA; the tag is in the trailing comment.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify.py diffs against the PR base
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: verify (frozen golden files, .env, secrets)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/verify.py --base origin/${{ github.base_ref }}

  ui:
    # UI build and type-check (issue #41). The Python job does not need the build:
    # without ui/dist the API answers / with a "ui_not_built" problem.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
