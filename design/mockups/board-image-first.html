<!-- Clickable mock-up of the image-first UI (issue #226, reviewed by Joe on 2026-11-09).
     A visual reference for PRD 8A and 8B, not product code: images are generated placeholders,
     and every title, maker and record field is an example, not a real record.
     Colours are copied from design/tokens.json; the app itself uses the generated token CSS.
     Open the file in a browser. Nothing runs or is sent anywhere. -->
<title>refdesk Board Mock-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&family=JetBrains+Mono&display=swap">
<style>
/* Layout: thin gate rail + image-led masonry grid; detail lives in a lightbox overlay. Tokens copied from design/tokens.json. */
:root{
  --paper:#F7F4EE;--card:#FFFFFF;--sunken:#EDE8DF;--ink:#1E1A16;--ink-muted:#5C554B;
  --line:#D8D1C4;--line-strong:#7A7266;--accent:#0E5A60;--accent-hover:#0A474C;--on-accent:#FFFFFF;
  --accent-soft:#DDEDEE;--ok:#1D6B3F;--ok-soft:#E0F0E6;--warn:#7A4E00;--warn-soft:#FAEBC8;
  --danger:#9A2B2B;--danger-soft:#F6DFDF;--focus:#0E5A60;--scrim:rgba(18,16,13,.92);--scrim-ink:#F2EDE4;
  --display:"Newsreader",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--logo:"Cal Sans","Inter",system-ui,sans-serif;
  --rail:248px;--r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161411;--card:#201D19;--sunken:#0F0E0C;--ink:#F2EDE4;--ink-muted:#B5AC9E;--line:#38332C;--line-strong:#8C8374;
  --accent:#6CC4CA;--accent-hover:#8FD6DB;--on-accent:#08201F;--accent-soft:#123436;--ok:#7FD3A1;--ok-soft:#14301F;
  --warn:#EDB654;--warn-soft:#3A2B0A;--danger:#F2A0A0;--danger-soft:#3D1818;--focus:#8FD6DB;--scrim:rgba(6,5,4,.94);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161411;--card:#201D19;--sunken:#0F0E0C;--ink:#F2EDE4;--ink-muted:#B5AC9E;--line:#38332C;--line-strong:#8C8374;
  --accent:#6CC4CA;--accent-hover:#8FD6DB;--on-accent:#08201F;--accent-soft:#123436;--ok:#7FD3A1;--ok-soft:#14301F;
  --warn:#EDB654;--warn-soft:#3A2B0A;--danger:#F2A0A0;--danger-soft:#3D1818;--focus:#8FD6DB;--scrim:rgba(6,5,4,.94);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/22px var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:flex;min-height:100%}

/* Gate rail */
/* The rail always takes its own space. Minimised, it keeps one icon per stage; the state stays readable from the node style and its pip. */
:root.min{--rail:56px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;width:var(--rail);flex:none;z-index:20;transition:width .18s ease}
.rail-inner{height:100%;background:var(--card);border-right:1px solid var(--line);overflow:hidden auto;display:flex;flex-direction:column;padding:12px 0 12px max(0px,env(safe-area-inset-left,0px))}
#steps{display:flex;flex-direction:column}
.min .step-text,.min .nor span,.min .brand span{display:none}
.min #tog svg{transform:scaleX(-1)}
.node svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node{position:relative}
.pip{position:absolute;right:-5px;bottom:-5px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;font-size:8px;line-height:1;border:1.5px solid var(--card)}
.pip.ok{background:var(--ok);color:var(--card)}
.pip.lock{background:var(--danger);color:var(--card);border-radius:3px}
.pip svg{width:8px;height:8px;stroke-width:3}
.brand{font:400 22px/28px var(--logo);letter-spacing:.01em;padding:0 16px 12px;white-space:nowrap}
.brand b{display:inline-block;min-width:24px;text-align:center;font-weight:400}
:root:not(.min) .brand b{min-width:0;text-align:left}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;padding:8px 16px;border:0;background:none;text-align:left;cursor:pointer;white-space:nowrap}
.step:disabled{cursor:default}
.step[aria-current]{background:var(--accent-soft)}
.rail-sep{margin:8px 16px 4px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.min .rail-sep span{display:none}
.saved{font-size:13px;color:var(--ink-muted);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.saved b{color:var(--ok);font-weight:600}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(400px,calc(100% - 32px));background:var(--ink);color:var(--paper);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{border:1px solid currentColor;background:none;color:inherit;border-radius:var(--r);padding:3px 10px;cursor:pointer;font-size:13px}
.page-h{font:500 30px/36px var(--display);margin:0 0 4px}
/* Every board card gets the same size: equal rows, a fixed-ratio cover, a two-line title slot, and the saved line pinned to the bottom. */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));grid-auto-rows:1fr;gap:16px;margin-top:16px}
.boards li{display:flex;min-width:0}
.bcard-btn{position:relative;display:flex;flex-direction:column;width:100%;height:100%;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:left;cursor:pointer;overflow:hidden}
.bcard-btn:hover{border-color:var(--line-strong)}
.mosaic{flex:none;width:100%;aspect-ratio:4/3;overflow:hidden;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2px;background:var(--line)}
.mosaic>*{width:100%;height:100%;min-width:0;min-height:0;object-fit:cover;display:block;background:var(--sunken)}
.bmeta{flex:1;display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px;min-width:0}
.bmeta .t-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.bmeta .note{margin-top:auto;padding-top:4px}
.bstate{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
.bstate svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bstate.warn{color:var(--warn)}.bstate.lock{color:var(--ink-muted)}
.here{position:absolute;top:8px;left:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px}
.field textarea,.field select{font:inherit;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--paper);color:var(--ink);resize:vertical}
.node{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--line-strong);color:var(--ink-muted);background:var(--card)}
.node.passed{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.node.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.node.locked{border-style:dashed}
.step-text{display:flex;flex-direction:column;min-width:0}
.step-name{font-weight:600;font-size:13px;line-height:24px}
.step-meta{font-size:13px;line-height:19px;color:var(--ink-muted)}
.gid{font:13px var(--mono);color:var(--ink-muted)}
/* Timeline connector: dotted between stages, solid green below a stage that is done. Centred on the 24px node (16px padding + 12px). */
#steps .step{position:relative}
#steps .step:not(:first-child)::before{content:"";position:absolute;left:27px;top:0;height:8px;border-left:2px dotted var(--line-strong)}
#steps .step:not(:last-child)::after{content:"";position:absolute;left:27px;top:32px;bottom:0;border-left:2px dotted var(--line-strong)}
#steps .step.done::after,#steps .step.done+.step::before,#steps .step.done+.nor::after{border-left-style:solid;border-color:var(--ok)}
.nor{position:relative}
.nor::after{content:"";position:absolute;left:27px;top:0;bottom:0;border-left:2px dotted var(--line-strong)}
.node.open{border-color:var(--accent);color:var(--accent)}
/* Landing hierarchy: 1 headline, 2 the prompt (largest object), 3 usage switch, 4 examples, 5 resume. Space between groups does the grouping. */
.hero{max-width:680px;margin:clamp(8px,9vh,112px) auto 0;display:flex;flex-direction:column;text-align:center}
/* Landing fits one screen: spacing scales with viewport height, and the bottom padding reserved for the action bar is dropped. */
main.landing{padding-block:16px;display:flex;flex-direction:column}
main.landing #view{flex:1;display:flex;flex-direction:column}
main.landing .hero{flex:1;width:100%}
/* The resume row sits at the foot of the screen; the space above it grows with the screen. */
main.landing .resume{margin-top:auto}
.go:disabled{background:var(--sunken);color:var(--ink-muted);opacity:1}
@media (max-height:640px){main.landing{padding-block:8px}.hero{margin-top:4vh}.hero-sub{margin-top:6px}.resume{margin-top:12px}}
@media (max-width:720px){.hero{margin-top:8px}.hero-sub{margin-bottom:16px}.suggest .sg:nth-of-type(n+2){display:none}.resume{margin-top:12px}main.landing{padding-block:8px}}
.hero-h{font:500 clamp(30px,5.2vh,44px)/1.1 var(--display);margin:0;text-wrap:balance}
.hero-sub{margin:10px auto clamp(24px,8vh,80px);max-width:48ch;color:var(--ink-muted);font-size:15px}
/* Usage switch and its hint share one tray, so the hint reads as part of the choice. */
.usage{border:0;margin:0 0 clamp(16px,3.6vh,32px);padding:8px 6px 10px;align-self:center;display:flex;flex-direction:column;align-items:center;background:var(--sunken);border-radius:20px;min-width:0;max-width:100%}
.useg{display:inline-flex;flex-wrap:wrap;justify-content:center;padding:0;border-radius:999px;gap:2px}
.useg input{position:absolute;opacity:0;pointer-events:none}
.useg label{padding:5px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-muted)}
.useg input:checked+label{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.useg input:focus-visible+label{outline:2px solid var(--focus);outline-offset:1px}
.use-hint{margin:7px 14px 0;font-size:13px;line-height:19px;color:var(--ink-muted)}
.prompt{background:var(--card);border:1px solid var(--line-strong);border-radius:14px;padding:12px 12px 10px 14px;text-align:left;box-shadow:0 6px 24px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.prompt:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prompt textarea{border:0;background:none;resize:none;font:400 15px/22px var(--sans);color:var(--ink);outline:none;width:100%;padding:0}
.prompt-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:15px;font-size:13px;background:var(--paper);color:var(--ink);cursor:pointer}
.chip select,.chip input[type=text]{border:0;background:none;font:inherit;color:inherit;padding:0;outline:none}
/* Options: the conditions, avoid list, anchor work and count from the old S1 form, folded into the prompt. Hidden by default; a count shows how many are set. */
.adv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px;padding:12px 0 6px;margin-top:4px;border-top:1px solid var(--line)}
.adv .wide2{grid-column:span 2}
.adv label{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:19px;color:var(--ink-muted);text-align:left;min-width:0}
.adv input{font:inherit;font-size:15px;line-height:22px;color:var(--ink);padding:5px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper);min-width:0;width:100%}
@media (max-width:720px){.adv{grid-template-columns:1fr 1fr}}
.opt-tog{cursor:pointer;gap:5px}
.opt-tog[aria-expanded="true"]{color:var(--ink)}
.opt-tog[aria-expanded="true"] .chev{display:inline-block;transform:rotate(180deg)}
.cnt{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 6px;font-size:12px;line-height:16px;font-weight:600}
.chip input.capin{width:36px;border-bottom:1px dashed var(--line-strong)}
/* Options inside the prompt are quiet text, not filled pills, so the brief and the button carry the box. The keep-local state stays visible. */
.chip,.chip:has(input[type=checkbox]:checked){background:none;border-color:transparent;color:var(--ink-muted);padding:0 4px;font-size:13px;height:28px}
.chip input[type=checkbox]{accent-color:var(--accent);margin:0;width:13px;height:13px}
.opts{gap:10px}
.chip:focus-within{outline:2px solid var(--focus);outline-offset:1px}

.go{border-radius:10px;padding:8px 18px}
.suggest{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;align-items:baseline;margin-top:18px;font-size:13px}
.suggest .sg:nth-of-type(n+3){display:none}

.sg{border:0;background:none;padding:2px 0;font-size:13px;cursor:pointer;color:var(--ink-muted);text-decoration:none;text-underline-offset:3px}
.sg:hover,.sg:focus-visible{color:var(--ink);text-decoration:underline}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;text-align:left;border-top:1px solid var(--line);padding-top:10px;margin-top:clamp(20px,7vh,72px)}
.prompt textarea{min-height:48px}
.suggest{margin-top:clamp(16px,4vh,36px);margin-bottom:clamp(24px,6vh,72px)}
.resume img{width:32px;height:32px;object-fit:cover;border-radius:4px}
.resume .btn{padding:4px 10px;font-size:13px;font-weight:500}
.resume #nb-all{border:0;padding:4px 2px;color:var(--ink-muted)}
.resume #nb-all:hover{color:var(--ink);text-decoration:underline}

.resume .t-title{font-size:13px;line-height:19px}

.resume{gap:10px}
/* Resume row: centred on the page axis like everything above it; one pill opens the draft, a text link opens all boards. */
.hero .resume{flex-direction:column;align-items:center;gap:8px;text-align:center;border-top:0;padding-top:0}
.resume-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;max-width:100%}
.resume-card{display:inline-flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;color:var(--ink);font-size:13px;line-height:19px;max-width:100%;min-width:0}
.resume-card:hover{border-color:var(--line-strong)}
.hero .resume-card img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.resume-card .t-title{font-size:13px;font-weight:600;white-space:nowrap}
.resume-card .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.resume-card .arr{color:var(--accent);font-weight:600}
.link{border:0;background:none;padding:4px 2px;color:var(--ink-muted);font-size:13px;cursor:pointer}
.link:hover,.link:focus-visible{color:var(--ink);text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.hero-h{font-size:30px;line-height:36px}.prompt-row .go{width:100%}}
.meter{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--danger)}
.events{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.events li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;font-size:15px}
.events time{font:13px/22px var(--mono);color:var(--ink-muted)}
.events .stop{color:var(--danger);font-weight:600}
.rec.wide{font-size:15px;gap:6px 16px}
.nor{margin:0;padding:6px 16px;display:flex;align-items:center;gap:12px;white-space:nowrap;color:var(--danger);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.nor::before{content:"";flex:none;width:24px;border-top:2px dashed var(--danger)}
.rail-foot{margin-top:auto;padding:8px 0;white-space:nowrap;display:flex;flex-direction:column;gap:8px}
.rail-foot .pin{margin-left:16px;align-self:flex-start}
.opt-group{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.opt-group legend{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding:0;margin-bottom:4px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) 150px;gap:12px 16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:15px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt .tile{margin:0}
.theme-row{display:flex;flex-wrap:wrap;gap:8px}
.opt.small{grid-template-columns:auto auto;flex:1 1 140px;justify-content:start}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line-strong);vertical-align:-2px;margin-right:6px}
.opt .tile-btn{cursor:default}
@media (max-width:560px){.opt{grid-template-columns:auto minmax(0,1fr)}.opt .tile{grid-column:2;max-width:180px}}
.pin{border:1px solid var(--line-strong);background:none;border-radius:var(--r);font-size:12px;padding:2px 8px;cursor:pointer}

/* Main */
main{flex:1;min-width:0;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;line-height:19px;padding:8px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);margin-bottom:12px}
.status strong{color:var(--warn)}
.status .local{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-bottom:16px}
.brief{font:500 30px/36px var(--display);margin:0;flex:1 1 280px;text-wrap:balance}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--card);padding:4px 10px;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.compare{font-size:13px;color:var(--ink-muted);max-width:60ch;margin:-8px 0 16px}

/* Grid */
.grid{columns:4 220px;column-gap:12px}
.tile{break-inside:avoid;margin:0 0 12px;position:relative;background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.tile.kept{outline:2px solid var(--accent);outline-offset:-1px}
.tile.dropped{opacity:.35}
.tile-btn{display:block;width:100%;padding:0;border:0;background:var(--sunken);cursor:zoom-in;position:relative}
.tile-btn img{display:block;width:100%;height:auto}
.noimg{display:grid;place-items:center;aspect-ratio:4/3;padding:16px;text-align:center;font-size:13px;color:var(--ink-muted);gap:4px}
.cap{position:absolute;inset:auto 0 0 0;padding:24px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#F7F4EE;text-align:left;font-size:12px;line-height:16px;opacity:0;transition:opacity .15s}
.tile-btn:hover .cap,.tile-btn:focus-visible .cap{opacity:1}
.d-captions .cap,.d-full .cap{display:none}
.meta{display:none;padding:8px 10px 10px;gap:6px;flex-direction:column}
.d-captions .meta,.d-full .meta{display:flex}
.t-title{font-weight:600;font-size:13px;line-height:18px}
.t-maker{font-size:13px;line-height:19px;color:var(--ink-muted)}
.why{display:none;font-size:13px;line-height:19px}
.d-full .why{display:block}
.chips{display:none;flex-wrap:wrap;gap:4px}
.d-full .chips{display:flex}
.ev{font:13px/19px var(--mono);background:var(--sunken);border-radius:4px;padding:1px 6px;color:var(--ink-muted)}
.keepbar{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.kbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.2);background:var(--card);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.tile:hover .kbtn,.tile:focus-within .kbtn,.kbtn[aria-pressed="true"]{opacity:1}
.kbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (hover:none){.kbtn{opacity:1}}

/* Badges: option A (compact marks) */
.marks{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;pointer-events:none}
.d-captions .marks,.d-full .marks{position:static;padding:0}

<script>
(function(){
// Fixed wording, copied from ui/src/generated/wording.ts.

    const l2=Math.max(8,Math.min(92,L+(R()-.5)*50));gr.addColorStop(0,`hsla(${H+(R()-.5)*40} ${S+10}% ${l2}% / .85)`);gr.addColorStop(1,`hsla(${H} ${S}% ${l2}% / 0)`);g.fillStyle=gr;g.fillRect(0,0,w,h)}
  g.fillStyle=`hsla(45 30% 92% / .9)`;g.beginPath();g.arc(w*(.25+R()*.5),h*(.2+R()*.3),w*(.08+R()*.08),0,7);g.fill();

ITEMS.forEach((it,i)=>{it.id=i;it.n=String(i+1).padStart(2,"0");it.src=it.ri==="permission"?null:paint(it,i);it.kept=null;});

  const cur=order.indexOf(S.stage);
  return STEPS.map(s=>{
    if(s==="nor")return `<div class="nor" title="Nothing below this line can be undone"><span>Point of no return</span></div>`;

  if(k==="escape")closeLB();else if(k==="arrowright")step(1);else if(k==="arrowleft")step(-1);
  else if(k==="i"){S.info=!S.info;drawLB()}else if(k==="z"){S.zoom=!S.zoom;pan={x:0,y:0};applyZoom()}
  else if(k==="k")decide("keep");else if(k==="d")decide("drop");
  else if(k==="tab"){const f=[...$("lb").querySelectorAll("button:not([hidden]),[href],input")].filter(x=>x.offsetParent);if(!f.length)return;
    const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});

// Page events
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){openLB(+o.dataset.open);return}
  const kb=e.target.closest("[data-keep]");if(kb){const it=ITEMS[+kb.dataset.keep];
    if(S.stage==="verify")S.decided[it.id]=S.decided[it.id]==="keep"?null:"keep";else it.kept=!it.kept;touch();render();return}
  const bd=e.target.closest("[data-board]");if(bd){if(bd.dataset.board==="cur"){S.view=null;S.boardOpen=true;render();window.scrollTo(0,0)}else toast("Mock-up: only the current board opens.");return}
  const mk=e.target.closest("[data-mock]");if(mk){toast(mk.dataset.mock);return}
  const g=e.target.closest("[data-go]");if(g){S.stage=g.dataset.go;S.reached=Math.max(S.reached,order.indexOf(S.stage));S.density=null;render();window.scrollTo(0,0);return}
  const st=e.target.closest(".step[data-k]");if(st&&!st.disabled){S.view=null;S.stage=st.dataset.k;S.density=null;render();return}
  const d=e.target.closest("[data-d]");if(d){S.density=d.dataset.d;render();return}
});
$("to-settings").onclick=()=>{S.view="settings";render();window.scrollTo(0,0)};
$("to-boards").onclick=()=>{S.view="boards";S.boardOpen=false;render();window.scrollTo(0,0)};
$("to-new").onclick=goNew;
renderSave();
let mini=false;try{mini=localStorage.getItem("refdesk-rail")==="min"}catch(e){}
function setMini(v){mini=v;document.documentElement.classList.toggle("min",v);const t=$("tog");
  t.setAttribute("aria-expanded",String(!v));t.setAttribute("aria-label",v?"Expand the stage panel":"Minimise the stage panel");t.title=v?"Expand":"Minimise";
  try{localStorage.setItem("refdesk-rail",v?"min":"open")}catch(e){}}
$("tog").onclick=()=>setMini(!mini);setMini(mini);
if(S.theme!=="system")setTheme(S.theme);
render();
})();
</script>
