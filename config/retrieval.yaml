# Retrieval settings (issues #34, #45). Part of the eval config hash: changing them gives a new
# report name rather than overwriting an old one.
combined:
  # score = similarity * cosine + attributes * jaccard. Untuned placeholder (Joe, 2026-10-12):
  # tune on golden-v1, never on the synthetic golden-v0.
  weights:
    similarity: 0.6
    attributes: 0.4
  # boost: adds to the attribute score. filter: a record must have it.
  # Boost by default, because a filter drops records whose source leaves the field empty.
  conditions:
    period: boost
    material: boost
    motif: boost
    department: boost

# The retriever behind POST /boards (issue #45). If it cannot load (e.g. no torch or no
# index), the run stops with "source unavailable" and says what is missing. There is no
# silent fallback to another retriever.
api:
  retriever: combined
  # Rationales and verification for each item (issue #98, ADR-022). The default is the
  # mock server for both (CLAUDE.md: default to the mock); start it with
  # `uv run python -m refdesk.llm.mock_server --port 8100`. For real models, set
  # generator_tier to local-small and judge_tier to auto (picks judge-phi4).
  # REFDESK_GENERATOR_TIER overrides generator_tier; "none" gives retrieval-only boards.
  # `prompts` pins each prompt version (src/refdesk/prompts/CHANGELOG.md); moving one is
  # Joe's call after an eval (issue #135). `refdesk eval-rationales` flags override it.
  reasoning:
    generator_tier: mock
    judge_tier: mock-judge
    prompts:
      rationale: rationale-v2  # Joe, 2026-10-27 (#135)
      judge: judge-v1
      fit: fit-v1
