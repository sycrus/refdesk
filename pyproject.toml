[project]
name = "refdesk"
version = "0.1.0"
description = "Rights-checked, explained art-reference workflow from open museum collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15,<2",
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
embed = [
    "open-clip-torch>=3.3,<4",
    "torch==2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",  # Starlette's TestClient (tests/api); plain httpx is deprecated there
    "openapi-spec-validator>=0.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["refdesk", "verify", "next_issue"]

# PyTorch with CUDA 12.8 (needed for the RTX 5080, compute capability 12.0) comes from
# PyTorch's own index. `explicit` keeps every other package on PyPI. Only the optional
# `embed` extra uses it, so CI (no GPU) never downloads it: uv sync --extra embed.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
