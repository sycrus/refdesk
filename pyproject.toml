[project]
name = "refdesk"
version = "0.1.0"
description = "Rights-checked, explained art-reference workflow from open museum collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "openapi-spec-validator>=0.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["refdesk", "verify", "next_issue"]
